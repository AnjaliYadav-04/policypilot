resources:
  jobs:
    # Offline ingestion: SEC EDGAR -> Delta (CDF) -> Vector Search sync. Runs on serverless compute.
    policypilot_ingest:
      name: policypilot-ingest-${bundle.target}
      max_concurrent_runs: 1
      tasks:
        - task_key: seed_chunks_table
          notebook_task:
            notebook_path: ../notebooks/seed_chunks_table.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              tickers: ""
              sec_user_agent: ${var.sec_user_agent}
        - task_key: sync_vector_index
          depends_on:
            - task_key: seed_chunks_table
          notebook_task:
            notebook_path: ../notebooks/create_vector_index.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              vs_endpoint: ${var.vs_endpoint}

    # One-time (and idempotent) gateway setup. Needs READ on the Key Vault-backed secret scope.
    policypilot_gateway_setup:
      name: policypilot-gateway-setup-${bundle.target}
      tasks:
        - task_key: create_gateway
          notebook_task:
            notebook_path: ../notebooks/create_gateway.py
            base_parameters:
              endpoint_name: ${var.llm_endpoint}
