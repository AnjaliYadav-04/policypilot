[project]
name = "policypilot"
version = "0.1.0"
description = "Governed, citation-first agentic RAG over SEC 10-K filings on Azure Databricks"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
